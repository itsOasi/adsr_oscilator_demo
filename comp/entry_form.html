<div class="container" id="enter-raffle-container">
  <h1>Enter the Raffle to Win Prizes</h1>
  <form id="enter-raffle-form" class="form" name="enter-raffle-form">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" class="form-control" />
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" class="form-control" />
    </div>
    <div class="form-group">
      <label for="facebook">Facebook Profile:</label>
      <input type="facebook" id="facebook" class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary">Enter Raffle</button>
  </form>
  <p class="small text-muted">By entering your email address and name, you agree to our <a href="/privacy-policy">privacy policy</a>.</p>
</div>
<div id="thank-you-container" class="container" style="display: none;">
  <h2>Thank You for Your Submission!</h2>
  <p>Upcoming raffle drawings will be held on the first of each month at 3:00 PM.</p>
  <div class="social-media-links">
    <a href="https://facebook.com" target="_blank">Facebook</a> |
    <a href="https://twitter.com" target="_blank">Twitter</a> |
    <a href="https://instagram.com" target="_blank">Instagram</a>
  </div>
  <script>
    const raffleForm = document.getElementById('enter-raffle-form');
    const thankYouContainer = document.getElementById('thank-you-container');
    const enterRaffleContainer = document.getElementById('enter-raffle-container');
    
    raffleForm.onsubmit = async function(event) {
        event.preventDefault();
        
        // Hide the form and show loading message
        enterRaffleContainer.style.display = 'none';

        // Create a loading message
        const loadingMessage = document.createElement('p');
        loadingMessage.innerText = 'Submitting your entry...';
        document.body.appendChild(loadingMessage);

        try {
            const response = await fetch('https://hook.us2.make.com/cjqbxpw6d5juypq42qcnyqp7bnlol9s4', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value
                })
            });

            const result = await response.text();

            if (result == "Accepted") {
                // Hide loading message and show thank you container
                loadingMessage.style.display = 'none';
                thankYouContainer.style.display = 'block';
            }
        } catch (error) {
      alert('An error occurred while submitting your entry.');
            console.error('Error submitting form:', error);
        }
    };
  </script>
</div>

<div class="container text-center">
    <div class="row">
        <div class="col-md-12">
            <h1>Click to Spin</h1>
        </div>
    </div>
    <div class="row">
        <div id="spin" class="col-md-12">
            <div id="container3D"></div>
            <h1 id="winner" class="title" hidden></h1>
        </div>
    </div>
    <div class="row">
        <div id="entries" class="col-md-12 text-center">
            <p>Number of Entries: <span id="num_of_entries">0</span></p>
        </div>
    </div>
    <style>
        #container3D > canvas {
            margin: auto;
        }
    </style>
    <script>
        (function () {
            let winner = {}
            let entries = [];
            let entryurl = "https://docs.google.com/forms/d/e/1FAIpQLScR1TZTo7mveYXlaG6zcJr-jgd_yKQYn_qzsdUv1MhUIfOMCw/viewform?usp=header";

            // add share button
            let shareBtn = document.createElement('button');
            shareBtn.classList.add('btn', 'btn-outline-secondary', 'ms-2');
            shareBtn.innerHTML = '<i class="bi bi-share btn btn-primary">Share<div id="qrcode" hidden></div></i>';
            document.querySelector("header").appendChild(shareBtn);
            shareBtn.onclick = () => {
                let qrCodeDiv = document.querySelector("#qrcode");
                qrCodeDiv.hidden = !qrCodeDiv.hidden;
            };

            // create qr code for sharing
            fetch("https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(entryurl))
                .then(response => response.blob())
                .then(blob => {
                    let img = document.createElement('img');
                    img.src = URL.createObjectURL(blob);
                    img.alt = "QR Code for Giveaway";
                    img.classList.add('img-fluid', 'mt-3');
                    document.querySelector("#qrcode").appendChild(img);
                })
                .catch(error => console.error('Error fetching QR code:', error));
                document.querySelector("#home").onclick = () => {
                    shareBtn.remove();
                    navigateTo("home")
                };
            let getNumEntries = async () => {
                document.querySelector("#num_of_entries").innerText = "...";
                try {
                    let response = await fetch("https://hook.us2.make.com/qpd5xpaj1dh6ejp0nuhf5ytpcuoh4t3v");
                    if (!response.ok) throw new Error('Network response was not ok');
                    let data = await response.json();
                    document.querySelector("#num_of_entries").innerText = data.length;
                } catch (error) {
                    document.querySelector("#num_of_entries").innerText = "Error";
                    console.error('Error fetching number of entries:', error);
                }
            };
            let getWinner = async () => {
                try {
                    let response = await fetch("https://hook.us2.make.com/qpd5xpaj1dh6ejp0nuhf5ytpcuoh4t3v");
                    if (!response.ok) throw new Error('Network response was not ok');
                    let data = await response.json();
                    console.log(data);
                    if (data.length > 0) {
                        winner = data[Math.floor(Math.random() * data.length)];
                        document.querySelector("#winner").innerText = `Winner: ${winner[0]} (${winner[1]})`;
                    } else {
                        document.querySelector("#winner").innerText = "No entries found.";
                    }
                    document.querySelector("#winner").hidden = false;
                } catch (error) {
                    console.error('Error fetching winner:', error);
                }
            };

            // user clicks on the spin button
            document.querySelector("#spin").onclick = async () => {
                console.log("Spinning the wheel...");
                getWinner()
            };
            document.querySelector("#entries").onclick = async () => {
                console.log("Fetching number of entries...");
                getNumEntries();
            };

            //Start the 3D rendering
            messageBus.emit("createWheel");
        })()
    </script>
</div>

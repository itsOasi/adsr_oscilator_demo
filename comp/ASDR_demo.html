<div>
  <div id="oscillator-component">
    <h3>Oscillator + ADSR</h3>

    <div class="knob-wrapper">
      <div id="attackKnob" class="knob"></div>
      <div class="knob-label">A</div>
    </div>
    <div class="knob-wrapper">
      <div id="decayKnob" class="knob"></div>
      <div class="knob-label">D</div>
    </div>
    <div class="knob-wrapper">
      <div id="sustainKnob" class="knob"></div>
      <div class="knob-label">S</div>
    </div>
    <div class="knob-wrapper">
      <div id="releaseKnob" class="knob"></div>
      <div class="knob-label">R</div>
    </div>
  </div>

  <div id="keyboard-component">
    <h3>Keyboard</h3>
    <div id="keys"></div>
  </div>

  <style>
    #oscillator-component {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    .knob-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .knob-label {
      margin-top: 8px;
      font-weight: bold;
    }

    .knob {
	width: 60px;
		height: 60px;
		border-radius: 50%;
		background-image: url("/static/knob.svg");
		background-size: contain;
		background-repeat: no-repeat;
		background-position: center;
		filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
		cursor: pointer;
		transform: rotate(0deg);
		transition: transform 0.05s linear;

    }
  </style>

  <script>
    (function() {
		const adsr = {a:0.1, d:0.1, s:0.7, r:0.5, gain:0.5};
		const octaveC4 = [
			{ name: "C4",  value: 60 },
			{ name: "C#4", value: 61 },
			{ name: "D4",  value: 62 },
			{ name: "D#4", value: 63 },
			{ name: "E4",  value: 64 },
			{ name: "F4",  value: 65 },
			{ name: "F#4", value: 66 },
			{ name: "G4",  value: 67 },
			{ name: "G#4", value: 68 },
			{ name: "A4",  value: 69 },
			{ name: "A#4", value: 70 },
			{ name: "B4",  value: 71 },
		];

		function initKnob(knobEl, prop, min, max) {
			let isDragging = false;
			let startY = 0;
			let startValue = 0;

			knobEl.addEventListener('mousedown', e => {
				isDragging = true;
				startY = e.clientY;
				startValue = adsr[prop];
			});

			document.addEventListener('mousemove', e => {
				if (!isDragging) return;
				let delta = startY - e.clientY;
				let newValue = startValue + delta * 0.005; // sensitivity
				newValue = Math.min(Math.max(newValue, min), max);
				adsr[prop] = newValue;
				knobEl.style.transform = `rotate(${newValue / max * 270 - 135}deg)`;
				messageBus.emit('adsrReady', {...adsr});
			});

			document.addEventListener('mouseup', () => isDragging = false);

			// Touch support
			knobEl.addEventListener('touchstart', e => {
				isDragging = true;
				startY = e.touches[0].clientY;
				startValue = adsr[prop];
			});
			document.addEventListener('touchmove', e => {
				if (!isDragging) return;
				let delta = startY - e.touches[0].clientY;
				let newValue = startValue + delta * 0.005;
				newValue = Math.min(Math.max(newValue, min), max);
				adsr[prop] = newValue;
				knobEl.style.transform = `rotate(${newValue / max * 270 - 135}deg)`;
				messageBus.emit('adsrReady', {...adsr});
			});
			document.addEventListener('touchend', () => isDragging = false);
		}

		function initADSR() {
			// Initialize knobs
			initKnob(document.getElementById('attackKnob'), 'a', 0, 2);
			initKnob(document.getElementById('decayKnob'), 'd', 0, 2);
			initKnob(document.getElementById('sustainKnob'), 's', 0, 1);
			initKnob(document.getElementById('releaseKnob'), 'r', 0, 2);

			// Initialize keyboard
			const keysDiv = document.querySelector('#keys');
			octaveC4.forEach(note => {
				const key = document.createElement('button');
				key.textContent = note.name;
				key.classList.add("key");
				if(note.name.includes("#")) key.classList.add("black");

				key.onmousedown = key.ontouchstart = () => {
				const currentADSR = messageBus.stickyEvents?.adsrReady || {...adsr};
				messageBus.emit('oscillatorNoteOn', { midiNote: note.value, adsr: {...currentADSR} });
				};
				key.onmouseup = key.ontouchend = () => {
				const currentADSR = messageBus.stickyEvents?.adsrReady || {...adsr};
				messageBus.emit('oscillatorNoteOff', { midiNote: note.value, adsr: {...currentADSR} });
				};

				keysDiv.appendChild(key);
			});

			messageBus.emit('adsrReady', {...adsr});
			messageBus.emit('keyboardReady');
			}

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', initADSR);
			} else {
				initADSR();
			}
    })();
  </script>
</div>

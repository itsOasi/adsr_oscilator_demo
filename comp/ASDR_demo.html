<div>
  	<div id="oscillator-component">
		<h3>Oscillator + ADSR</h3>
		<label>A: <input id="attack" type="range" min="0" max="2" step="0.01" value="0.1"></label>
		<label>D: <input id="decay" type="range" min="0" max="2" step="0.01" value="0.1"></label>
		<label>S: <input id="sustain" type="range" min="0" max="1" step="0.01" value="0.7"></label>
		<label>R: <input id="release" type="range" min="0" max="2" step="0.01" value="0.5"></label>
	</div>

  <div id="keyboard-component">
    <h3>Keyboard</h3>
    <div id="keys"></div>
  </div>

  <script>
    (function() {
		const adsr = {a:0.1, d:0.1, s:0.7, r:0.5, gain:0.5};
		const octaveC4 = [
			{ name: "C4",  value: 60 },
			{ name: "C#4", value: 61 },
			{ name: "D4",  value: 62 },
			{ name: "D#4", value: 63 },
			{ name: "E4",  value: 64 },
			{ name: "F4",  value: 65 },
			{ name: "F#4", value: 66 },
			{ name: "G4",  value: 67 },
			{ name: "G#4", value: 68 },
			{ name: "A4",  value: 69 },
			{ name: "A#4", value: 70 },
			{ name: "B4",  value: 71 },
		];

		function initADSR() {
			// Attach slider event handlers
			['attack','decay','sustain','release'].forEach(id => {
				const slider = document.querySelector(`#${id}`);
				slider.oninput = e => {
					adsr[id[0]] = parseFloat(e.target.value);
					// Emit a copy to message bus for anyone who needs the latest ADSR
					messageBus.emit('adsrReady', {...adsr});
				};
			});

			// Initialize keyboard
			const keysDiv = document.querySelector('#keys');
			octaveC4.forEach(note => {
				const key = document.createElement('button');
				key.textContent = note.name;
				key.classList.add("key");
				if(note.name.includes("#")) key.classList.add("black");

				key.onmousedown = key.ontouchstart = () => {
				const currentADSR = messageBus.stickyEvents?.adsrReady || {...adsr};
				messageBus.emit('oscillatorNoteOn', { midiNote: note.value, adsr: {...currentADSR} });
				};
				key.onmouseup = key.ontouchend = () => {
				const currentADSR = messageBus.stickyEvents?.adsrReady || {...adsr};
				messageBus.emit('oscillatorNoteOff', { midiNote: note.value, adsr: {...currentADSR} });
				};

				keysDiv.appendChild(key);
			});

			messageBus.emit('adsrReady', {...adsr});
			messageBus.emit('keyboardReady');
			}

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', initADSR);
			} else {
				initADSR();
			}
    })();
  </script>
</div>
